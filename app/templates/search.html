<div id="search-popup">
  <div id="popup-container">
    <div id="search-header">
      <button id="search-close" type="button" aria-label="검색에서 돌아가기">
        <img src="/chevron-left.svg" alt="" width="24" height="24" />
      </button>
      <form id="search-form">
        <img id="search-icon" src="/search.svg" alt="search" /><input
          id="search-input"
          type="search"
          name="search-input"
          placeholder="Search"
          autocomplete="off"
        />
        <div></div>
      </form>
    </div>
    <ul id="search-tag-list">
      {{#each tags}}
      <li class="search-tag-item">
        <a class="tag-link" href="#" data-tag="{{name}}">#{{name}} - {{count}}</a>
      </li>
      {{/each}}
    </ul>
    <ul id="search-blog-list">
      {{#each posts}}
      <li class="search-item">
        <a href="{{filePath}}" class="search-item-link">{{title}}</a>
      </li>
      {{/each}}
    </ul>
  </div>
</div>
<div id="overlay"></div>
